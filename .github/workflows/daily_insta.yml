name: Daily Instagram Carousel

on:
  schedule:
    # 7:30 AM IST (02:00 UTC) -> Hindi Mode
    - cron: '0 2 * * *'
    # 3:30 PM IST (10:00 UTC) -> Gujarati Mode
    - cron: '0 10 * * *'
    # 11:30 PM IST (18:00 UTC) -> English Mode
    - cron: '0 18 * * *'

  workflow_dispatch:
    inputs:
      mode_override:
        description: 'Force a specific mode (english, hindi, gujarati)'
        required: false
        type: choice
        options:
        - auto
        - english
        - hindi
        - gujarati
        default: 'auto'

permissions:
  contents: write

jobs:
  create-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # --- SETUP ---
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install requests
          npm install puppeteer

      # --- 0. SELECT VERSE ---
      - name: Select New Random Verse
        run: python scripts/selector.py

      # --- 1. DATA CURATION ---
      - name: Curate Data (All Languages)
        run: |
          python scripts/content_en.py
          python scripts/content_hi.py
          python scripts/content_gu.py

      # --- 2. RENDER IMAGES (All 6) ---
      - name: Render Images
        run: |
          # Verse Images
          node scripts/image_en.js
          node scripts/image_hi.js
          node scripts/image_gu.js
          
          # Explanation Images
          node scripts/image_en_ex.js
          node scripts/image_hi_ex.js
          node scripts/image_gu_ex.js

      # --- 3. DETERMINE MODE ---
      - name: Determine Post Mode
        id: set_mode
        run: |
          # Check if manual override was selected
          INPUT_MODE="${{ github.event.inputs.mode_override }}"
          
          if [[ -n "$INPUT_MODE" && "$INPUT_MODE" != "auto" ]]; then
            echo "Manual override detected: $INPUT_MODE"
            echo "mode=$INPUT_MODE" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Otherwise, check current UTC hour
          HOUR=$(date -u +%H)
          echo "Current UTC Hour: $HOUR"

          # Logic: Match the schedule times (approximate checks to be safe)
          if [ "$HOUR" -eq 2 ] || [ "$HOUR" -eq 02 ]; then
            echo "Detected 7:30 AM IST slot -> HINDI"
            echo "mode=hindi" >> $GITHUB_OUTPUT
            
          elif [ "$HOUR" -eq 10 ]; then
            echo "Detected 3:30 PM IST slot -> GUJARATI"
            echo "mode=gujarati" >> $GITHUB_OUTPUT
            
          elif [ "$HOUR" -eq 18 ]; then
            echo "Detected 11:30 PM IST slot -> ENGLISH"
            echo "mode=english" >> $GITHUB_OUTPUT
            
          else
            # Fallback if triggered at weird time manually without input
            echo "Time doesn't match standard slots. Defaulting to ENGLISH."
            echo "mode=english" >> $GITHUB_OUTPUT
          fi

      # --- 4. COMMIT HISTORY ---
      - name: Archive History & Data
        run: |
          git config --global user.name 'Gita Bot'
          git config --global user.email 'bot@noreply.github.com'
          
          # Add history and selection to ensure we don't repeat verses
          git add history.json selection.json
          
          # Add the generated content (optional, but good for debugging)
          git add content_data_*.json
          
          # We don't necessarily need to commit the images, but we can if you want them in the repo
          # git add *.png 
          
          git commit -m "Cycle update: ${{ steps.set_mode.outputs.mode }}" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- 5. POST TO INSTAGRAM ---
      - name: Post Carousel
        run: |
          echo "Posting in mode: ${{ steps.set_mode.outputs.mode }}"
          python scripts/post_carousel.py --mode ${{ steps.set_mode.outputs.mode }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_TOKEN: ${{ secrets.META_TOKEN }}